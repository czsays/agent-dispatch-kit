[project]
name = "agent-dispatch-kit"
version = "0.1.0"
description = "A genericized reference for a webhook-driven agent dispatch service: HMAC-verified intake, an async event queue, and a pluggable agent-backend seam."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
